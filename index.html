<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster Energy — Visual Concept</title><style>body{margin:0;background:#030403;color:#fff;font-family:Arial;overflow:hidden}*{box-sizing:border-box}.page{min-height:100vh;background:radial-gradient(circle at 50% 45%,#172016,#080b08 30%,#020302 70%);overflow:hidden}.grid{position:absolute;inset:-30%;background:linear-gradient(#a8ff0009 1px,transparent 1px),linear-gradient(90deg,#a8ff0009 1px,transparent 1px);background-size:70px 70px;transform:perspective(600px) rotateX(58deg) translateY(35%);animation:grid 12s linear infinite}@keyframes grid{to{background-position:0 70px,70px 0}}nav{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;border-bottom:1px solid #a8ff001f;backdrop-filter:blur(12px);position:relative;z-index:3}.brand{font-weight:900;letter-spacing:3px}.mark{color:#a8ff00;font-size:26px;margin-right:9px;text-shadow:0 0 20px #8dff00}nav span:last-child{font-size:11px;letter-spacing:2px;color:#aab2aa;border:1px solid #ffffff18;border-radius:999px;padding:10px 16px}main{min-height:calc(100vh - 82px);display:grid;place-items:center;position:relative;z-index:2;padding:30px 5vw}.hero{width:min(1150px,100%);display:grid;grid-template-columns:1fr 1fr;align-items:center}.copy{animation:rise 1s ease both}@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1}}.eyebrow{color:#a8ff00;font-size:11px;letter-spacing:5px;font-weight:800}h1{font-size:clamp(55px,8vw,105px);line-height:.82;letter-spacing:-6px;margin:20px 0}h1 span{color:transparent;-webkit-text-stroke:1px #d8ffbf33}.desc{max-width:450px;color:#a6ada6;line-height:1.7}.stage{height:620px;display:grid;place-items:center;position:relative;perspective:1200px}.ring{position:absolute;width:440px;height:440px;border:1px solid #a8ff0026;border-radius:50%;box-shadow:0 0 70px #7dff0012;animation:spin 16s linear infinite}.ring:before{content:"";position:absolute;inset:38px;border:1px dashed #a8ff0018;border-radius:50%}@keyframes spin{to{transform:rotate(360deg)}}.beam{position:absolute;width:520px;height:180px;background:linear-gradient(90deg,transparent,#a8ff0015,transparent);filter:blur(18px);transform:rotate(-28deg);animation:beam 4s ease-in-out infinite}@keyframes beam{50%{opacity:.3;transform:rotate(-28deg) translateX(80px)}}.canWrap{width:190px;height:500px;position:relative;transform-style:preserve-3d;will-change:transform}.can{position:absolute;inset:0;border-radius:28px 28px 23px 23px;background:linear-gradient(100deg,#090b09,#242824 18%,#080a08 40%,#161a16 62%,#050605);box-shadow:-22px 28px 55px #000,18px 8px 45px #9cff0017;overflow:hidden}.can:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 15%,#ffffff13 29%,transparent 40%,#ffffff08 68%,transparent 80%)}.top{position:absolute;left:7px;right:7px;top:-8px;height:34px;border-radius:50%;background:linear-gradient(#777,#191b19 55%,#050605)}.logo{position:absolute;left:25px;top:75px;width:140px;height:290px;filter:drop-shadow(0 0 16px #a8ff0035)}.logo i{position:absolute;background:linear-gradient(#d5ffae,#62d400);width:38px;border-radius:50% 50% 10% 10%;transform:skew(-18deg)}.logo i:nth-child(1){height:185px;left:18px;top:8px}.logo i:nth-child(2){height:240px;left:54px;top:35px}.logo i:nth-child(3){height:185px;left:91px}.logo i:after{content:"";position:absolute;inset:0;background:#071007;clip-path:polygon(35% 0,75% 0,56% 47%,100% 47%,35% 100%,49% 58%,0 58%)}.energy{position:absolute;bottom:55px;width:100%;text-align:center;font-size:12px;letter-spacing:5px;font-weight:900}.sub{position:absolute;bottom:35px;width:100%;text-align:center;font-size:7px;letter-spacing:3px;color:#8d958d}.shadow{position:absolute;bottom:54px;width:250px;height:38px;border-radius:50%;background:#000;filter:blur(18px);animation:shadow 4.8s ease-in-out infinite}@keyframes shadow{50%{transform:scale(.75);opacity:.55}}.p{position:absolute;width:3px;height:3px;background:#a8ff00;border-radius:50%;box-shadow:0 0 12px #a8ff00;animation:particle 8s linear infinite}@keyframes particle{from{transform:translateY(110vh);opacity:0}15%{opacity:.8}to{transform:translateY(-10vh);opacity:0}}@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.copy{order:2}.desc{margin:20px auto}.stage{height:500px}.ring{width:340px;height:340px}h1{letter-spacing:-4px}}</style></head><body><div class="page"><div class="grid"></div><nav><div class="brand"><span class="mark">M</span> MONSTER ENERGY</div><span>VISUAL CONCEPT / 01</span></nav><main><section class="hero"><div class="copy"><div class="eyebrow">UNLEASH THE BEAST</div><h1>ENERGY<br><span>WITHOUT</span><br>LIMITS.</h1><p class="desc">Metal escuro, verde elétrico, profundidade e uma lata flutuando com movimento cinematográfico.</p></div><div class="stage"><div class="beam"></div><div class="ring"></div><div class="shadow"></div><div class="canWrap" id="canWrap"><div class="can"><div class="top"></div><div class="logo"><i></i><i></i><i></i></div><div class="energy">MONSTER</div><div class="sub">ENERGY DRINK</div></div></div></div></section></main></div><script>for(let i=0;i<38;i++){let p=document.createElement('i');p.className='p';p.style.left=Math.random()*100+'%';p.style.animationDuration=5+Math.random()*8+'s';p.style.animationDelay=-Math.random()*10+'s';document.querySelector('.page').appendChild(p)}const w=document.getElementById('canWrap');let tx=-10,ty=0,x=-10,y=0;addEventListener('pointermove',e=>{ty=(e.clientX/innerWidth-.5)*18;tx=-10-(e.clientY/innerHeight-.5)*8});function a(){x+=(tx-x)*.045;y+=(ty-y)*.045;w.style.transform='translateY('+Math.sin(Date.now()/900)*12+'px) rotateY('+y+'deg) rotateX('+x+'deg)';requestAnimationFrame(a)}a();</script></body></html>
